<section id="loops" data-transition="fade" style="background:#faf8f3;color:#1f1e33;font-family:Inter, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px">
<h2 style="font-family:'Source Serif 4', Georgia, serif;font-size:68px;font-weight:600">Loops: for, while, break, continue</h2>
<div style="display:flex;gap:32px">
<div style="flex:1;background:#ffffff;border:1px solid #e3e0d6;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:28px;color:#2b2a4c;margin:0">continue</h3><p style="font-size:24px;line-height:1.5">Skip this one pass, keep looping</p></div>
<div style="flex:1;background:#ffffff;border:1px solid #e3e0d6;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:10px"><h3 style="font-size:28px;color:#2b2a4c;margin:0">break</h3><p style="font-size:24px;line-height:1.5">Stop the loop entirely, right now</p></div>
</div>
<div style="background:#f1ede1;border-radius:16px;padding:32px;font-family:'SF Mono', monospace;font-size:26px">for amount in orders:<br>&nbsp;&nbsp;&nbsp;&nbsp;if amount == 0: continue<br>&nbsp;&nbsp;&nbsp;&nbsp;total += amount</div>
<p style="position:absolute;left:128px;bottom:64px;font-size:24px;color:#8a8578">Gotcha: a while loop with no updating condition never stops — hangs scripts and cron jobs.</p>
